# ===== 生产环境配置 =====
spring:
  # 数据源：通过环境变量注入
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:campus_forum}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8mb4&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  # Redis：通过环境变量注入
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ===== 生产环境日志级别 =====
logging:
  level:
    root: warn
    com.campus.forum: info
  file:
    name: logs/campus-forum-backend.log

# ===== 生产环境关闭 SQL 日志 =====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ===== 生产环境 JWT 密钥通过环境变量注入 =====
jwt:
  secret: ${JWT_SECRET}

campus:
  upload-path: ${UPLOAD_PATH:/app/uploads/}
