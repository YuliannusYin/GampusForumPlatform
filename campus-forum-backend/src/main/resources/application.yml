# ===== 服务配置 =====
server:
  port: 8080
# 注意：不设置 context-path，因为所有 Controller 已在 @RequestMapping 中显式带 /api 前缀

# ===== Spring 配置 =====
spring:
  application:
    name: campus-forum-backend
  profiles:
    active: dev
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/campus_forum?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.campus.forum.entity
  configuration:
    # SQL 日志输出（生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键自增策略
      id-type: auto

# ===== JWT 配置 =====
jwt:
  # 密钥（生产环境应通过环境变量注入）
  secret: ${JWT_SECRET:Y2FtcHVzLWZvcnVtLXBsYXRmb3JtLWp3dC1zZWNyZXQta2V5LTIwMjQ=}
  # 访问令牌过期时间（秒），默认 2 小时
  access-token-expire: 7200
  # 刷新令牌过期时间（秒），默认 7 天
  refresh-token-expire: 604800

# ===== 校园论坛自定义配置 =====
campus:
  # 文件上传路径
  upload-path: ./uploads/

# ===== Knife4j 接口文档配置 =====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
