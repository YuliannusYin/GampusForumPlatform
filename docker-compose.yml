# ============================================================
# 校园论坛平台 Docker Compose 编排文件
# ------------------------------------------------------------
# 使用前请先将 .env.docker 复制为 .env，并修改其中的敏感配置：
#   cp .env.docker .env
# docker compose 会自动加载同目录下的 .env 文件
# ============================================================

services:
  # ============== MySQL 数据库 ==============
  mysql:
    image: mysql:8.0
    container_name: campus-forum-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      # 挂载初始化 SQL 脚本，容器首次启动时自动执行
      - ./docker/init:/docker-entrypoint-initdb.d
      # 数据持久化
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default

  # ============== Redis 缓存 ==============
  redis:
    image: redis:7-alpine
    container_name: campus-forum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  # ============== 后端服务 ==============
  backend:
    build:
      context: ./campus-forum-backend
      dockerfile: Dockerfile
    container_name: campus-forum-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # MySQL 配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Spring 配置
      SPRING_PROFILES_ACTIVE: prod
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE: ${JWT_ACCESS_TOKEN_EXPIRE}
      JWT_REFRESH_TOKEN_EXPIRE: ${JWT_REFRESH_TOKEN_EXPIRE}
      TZ: Asia/Shanghai
    volumes:
      # 挂载上传文件目录（与 nginx 共享）
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  # ============== 前端服务（Nginx） ==============
  frontend:
    build:
      context: ./campus-forum-frontend
      dockerfile: Dockerfile
    container_name: campus-forum-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 挂载自定义 nginx 配置
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 共享后端上传文件目录，只读访问
      - ./uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - backend
    networks:
      - default

# ============== 数据卷 ==============
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ============== 网络（使用默认 bridge） ==============
networks:
  default:
    driver: bridge
